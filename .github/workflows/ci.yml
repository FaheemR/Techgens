name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: techgens
          POSTGRES_PASSWORD: techgens
          POSTGRES_DB: techgens
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U techgens" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in package.json ("packageManager") before setup-node looks for it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://techgens:techgens@127.0.0.1:55432/techgens
      - run: pnpm --filter @techgens/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
